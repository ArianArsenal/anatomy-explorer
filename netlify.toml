# Netlify: build the Vite app and serve dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The model and environment files never change between builds of the same name; let browsers cache them.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/env/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
